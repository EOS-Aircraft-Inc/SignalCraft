[project]
name = "signalcraft"
version = "0.1.0"
description = "SignalCraft — ICD signal database tooling and Streamlit visualizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
